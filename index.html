<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- =========================
         HEADER
    ========================== -->
    <header>
        <h1>Expense Tracker</h1>
        <p>Manage your income and expenses easily</p>
    </header>

    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main>

        <!-- =========================
             BALANCE SECTION
        ========================== -->
        <section class="balance-section">

            <h2>Current Balance</h2>

            <h3 id="balance">₹0.00</h3>

        </section>


        <!-- =========================
             SUMMARY SECTION
        ========================== -->
        <section class="summary-section">

            <!-- Total Income -->
            <div class="summary-card">
                <h3>Total Income</h3>
                <p id="total-income">₹0.00</p>
            </div>

            <!-- Total Expenses -->
            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="total-expenses">₹0.00</p>
            </div>

            <!-- Remaining Balance -->
            <div class="summary-card">
                <h3>Remaining Balance</h3>
                <p id="remaining-balance">₹0.00</p>
            </div>

        </section>


        <!-- =========================
             ADD TRANSACTION SECTION
        ========================== -->
        <section class="transaction-form-section">

            <h2>Add Transaction</h2>

            <form id="transaction-form">

                <!-- Transaction Type -->
                <div class="form-group">

                    <label for="transaction-type"> Transaction Type </label>

                    <select id="transaction-type" name="transaction-type">

                        <option value="income">Income</option>
                        <option value="expense">Expense</option>

                    </select>

                </div>


                <!-- Description -->
                <div class="form-group">
                    <label for="description"> Description </label>

                    <input
                        type="text"
                        id="description"
                        name="description"
                        placeholder="e.g. Salary, Food, Travel"
                        required
                    >

                </div>


                <!-- Amount -->
                <div class="form-group">

                    <label for="amount"> Amount</label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="Enter amount"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <!-- Date -->
                <div class="form-group">

                    <label for="date"> Date</label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>


                <!-- Submit Button -->
                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </section>


        <!-- =========================
             TRANSACTION HISTORY
        ========================== -->
        <section class="history-section">

            <h2>Transaction History</h2>

            <!-- Transaction List -->
            <div class="transaction-list" id="transaction-list">

                    <div class="transaction">
                        <div>
                            <h3>Salary</h3>
                            <p>27-08-2026</p>
                        </div>

                        <div>
                            <span>+ ₹30,000</span>
                            <button>Delete</button>
                        </div>
                    </div>
                

                <p id="no-transactions">
                    No transactions added yet.
                </p>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer>

        <p>
            &copy; 2026 Expense Tracker
        </p>

    </footer>


    <!-- JavaScript file -->
    <script src="script.js"></script>

</body>

</html>
